<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Astropedia | Create a page</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="icon" href="{{ url_for('static', filename='a.ico') }}" type="image/x-icon">
<style>
  a{
    color: white;
  }
          #testbar{
    
    
    box-sizing: border-box;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
    background-color: #1f1f1f;
    height: 80px;
    width: 100%;
    color: white;
    position: fixed;
    z-index: 2;
    top: 0;
    left: 0;
    border-bottom:2px solid #f26a4b;;
}
.logo{
    color: white;
    font-size: 35px;
    line-height: 80px;
    padding: 0 100px;
    font-weight: bold;
}
#testbar ul{
    float: right;
    margin-right: 20px;
    margin-bottom: 20px;
    list-style: none;
    color: white;
    
}
#testbar ul li form {
    display: flex;
    align-items: center;
}
#testbar input,
#testbar button {
    margin: 0 5px;
    font-size: 16px;
}
#testbar ul li {
  display: flex;
  justify-content: center;
  margin-top: 20px;
  gap: 10px;
}


#testbar ul li{
    display: inline-block;
    line-height: 80px;
    margin: 0 5px;
    padding-bottom: 20px;
}
#testbar ul li a{
    color: white;
    font-size: 17px;
    text-transform: uppercase;
    padding: 7px 13px;
    border-radius: 3px;
}
a.active,a:hover{
    background-color: #0044cc;
    transition: .5s ease-in-out;
}

.checkbtn{
    color: white;
    font-size: 30px;
    float: right;
    line-height: 80px;
    margin-right: 40px;
    cursor: pointer;
    display: none;
}
#check{
display: none;
}
@media (max-width:952px){
    label.logo{
        font-size: 30px;
        padding-left: 50px;
    }
    #testbar ul li a{
        font-size: 16px;
    }
}
@media (max-width:858px){
    .checkbtn{
        display: block;
    }
#testbar ul {
    position: fixed;
    width: 100%;
    height: 100vh;
    background-color: #2c3e50;
    top: 80px;
    left: -100%;
    text-align: center;
    transition: all .5s;
    flex-direction: column;
}
    #testbar ul li{
        display: block;
    }
    #testbar ul li a{
        font-size: 20px;
    }
#testbar ul li a:hover, a.active {
    background: none;
    color: #0082e6;
}
#check:checked ~ ul{
    left: 0;
}
}
</style>

</head>
<body>
<header>
<nav id="testbar">
    <input type="checkbox" id="check">
    <label for="check" class="checkbtn">
        <i class="fas fa-bars"></i>
    </label>
    <label class="logo">Astropedia</label>
    <ul>
        <li><a href="{{url_for('index')}}">Home</a></li>
        <li><a href="{{url_for('news')}}">News</a></li>
        <li><a href="{{url_for('search')}}" >Search</a></li>
        <li><a href="{{url_for('create_page')}}" class="active">Create A Page</a></li>
        <li><a href="{{url_for('edit')}}" >Edit A Page</a></li>
    </ul>
</nav>
</header>

<form action="/create" method="POST" id="createform">
  <br>
  <input type="text" name="title" placeholder="Enter title for your article" id="titleform">
  <br>
  
  <!-- Article Content (Rich text) -->

  <textarea name="article_content" id="article_content" placeholder="Article Content" style="resize: both; width: 1000px; height: 100px;">
<h1><!-- Your heading here --></h1>
<p><!-- Article Content here --></p>
<p><small><!-- Pseudonym here --></small></p>
</textarea>
  <br>

  <textarea style="resize: both; width: 1000px; height: 100px;" name="article_css" id="article_content_css" placeholder="Article CSS">
<style>
/* Custom article styling */
</style>
  </textarea>

  <br>
  <input type="submit" value="Create" id="create">
  <br>
  <a href="{{url_for('tutorial1')}}"> Learn to put equations with MathJax </a>
  <br>
  <a href="{{url_for('tutorial2')}}"> Learn to create a page with Html, Css, and Javascript </a>
<br>
  <a href="/createcode">Use a WYSIWYG editor (What is see is what you get editor)</a>
  </form>
<footer>
    <div>
    <p> Made by ZenDo Devlopers</p>
    </div>
</footer>
</body>
</html>
